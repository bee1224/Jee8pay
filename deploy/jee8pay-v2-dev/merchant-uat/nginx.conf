log_format cf01_inner escape=json '{"ts":"$time_iso8601","host":"$host","method":"$request_method","uri":"$uri","status":$status,"client":"$remote_addr","peer":"$realip_remote_addr","cf_ray":"$http_cf_ray","request_id":"$http_x_request_id","upstream":"$upstream_addr","upstream_status":"$upstream_status","request_time":"$request_time"}';

server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s;

    # Only the nnviopp edge is attached to this internal transit network.
    # It overwrites X-Forwarded-For with the DNS-only client's source address.
    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    access_log /dev/stdout cf01_inner;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location = /api/pay/unifiedOrder {
        limit_except POST { deny all; }
        set $payment_backend payment;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 60s;
        proxy_pass http://$payment_backend:9216;
    }

    location = /api/pay/query {
        limit_except POST { deny all; }
        set $payment_backend payment;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://$payment_backend:9216;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name admin-v2-dev.nnviopp.com;
    resolver 127.0.0.11 valid=10s;

    # Only the nnviopp edge is attached to this internal transit network.
    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    access_log /dev/stdout cf01_inner;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location / {
        set $admin_ui manager-ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_pass http://$admin_ui:80;
    }
}
