server {
    listen 8080;
    server_name _;

    # Only the nnviopp edge is attached to this internal transit network.
    # It overwrites X-Forwarded-For with the DNS-only client's source address.
    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location = /api/pay/unifiedOrder {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 60s;
        proxy_pass http://payment:9216;
    }

    location = /api/pay/query {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://payment:9216;
    }

    location / {
        return 404;
    }
}
