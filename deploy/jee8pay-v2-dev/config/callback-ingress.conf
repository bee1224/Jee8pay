server {
    listen 8080;
    server_name _;

    # payment 容器重建後 IP 會變；以 Docker DNS 於請求時解析，避免緩存舊 IP 造成 502（TD-018）
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location = /api/pay/notify/ryo {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        set $payment_backend payment;
        proxy_pass http://$payment_backend:9216;
    }

    location = /api/pay/notify/jay {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        set $payment_backend payment;
        proxy_pass http://$payment_backend:9216;
    }

    location = /api/pay/notify/chi {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        set $payment_backend payment;
        proxy_pass http://$payment_backend:9216;
    }

    location = /api/pay/notify/jhd {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        set $payment_backend payment;
        proxy_pass http://$payment_backend:9216;
    }

    location / {
        return 404;
    }
}
