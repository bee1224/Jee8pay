# 測試機（server1.nnviopp.com）看門狗與資源警戒設定，安裝於 /etc/jee8pay-watchdog.conf。
# 腳本與正式機共用 deploy/jee8pay-v2-production/scripts/{service-watchdog,resource-monitor}.sh。
export TZ=Asia/Taipei
WATCH_PROJECTS="jee8pay-v2-dev=/opt/jee8pay-v2-dev/current/compose.yml jee8pay-v2-dev-edge jee8pay-v2-dev-merchant-uat"
V2_SECRET_DIR=/opt/jee8pay-v2-dev/secrets
EDGE_KEY=jee8pay-v2-dev-edge/sandbox-edge
EDGE_LISTEN_IP=159.198.40.128
TELEGRAM_TOKEN_FILE=/opt/jee8pay-v2-dev/secrets/telegram-bot-token
CONTAINER_MATCH="^(jee8pay-v2-dev|nnviopp-sandbox-edge)"
CONTAINER_PREFIX=jee8pay-v2-dev
HOST_LABEL=測試機
# 互相監控：測試機監看正式機
PEER_NAME=正式機
PEER_HOST=162.0.233.203
# 每日狀態報備：測試機沒有收款總結
EDGE_CERT=/etc/nnviopp-sandbox/edge-tls/fullchain.pem
SUMMARY_CONTAINER=
