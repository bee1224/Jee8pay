# Canonical copy of the production edge nginx config.
# Deployed to /etc/lp33ing-production/edge-nginx.conf (bind-mounted read-only into lp33ing-production-edge).
# After changing: cp to host path, then `docker exec lp33ing-production-edge nginx -t && nginx -s reload`.

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format edge 'request_id=$request_id source_ip=$remote_addr method=$request_method host=$host uri=$uri status=$status bytes=$body_bytes_sent request_time=$request_time';
  access_log /dev/stdout edge;
  sendfile on;
  keepalive_timeout 30s;
  client_body_timeout 15s;
  client_header_timeout 15s;
  client_max_body_size 12m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  map_hash_bucket_size 64;
  server_names_hash_bucket_size 64;

  map $uri $admin_auth_limit_key {
    default "";
    /api/admin/auth/login $binary_remote_addr;
    /api/portal/auth/login $binary_remote_addr;
  }
  map $uri $merchant_api_limit_key {
    default "";
    /api/pay_order $binary_remote_addr;
    /api/query_transaction $binary_remote_addr;
  }
  limit_req_zone $admin_auth_limit_key zone=admin_auth:10m rate=5r/m;
  limit_req_zone $merchant_api_limit_key zone=merchant_api:10m rate=5r/m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  upstream payment_api { server payment-api:8080; keepalive 16; }
  upstream payment_admin { server payment-admin:8080; keepalive 8; }

  server {
    listen 80 default_server;
    server_name _;
    location = /edge-health { access_log off; default_type text/plain; return 200 'OK'; }
    location / { return 444; }
  }
  server { listen 443 ssl default_server; server_name _; return 444; }
  server { listen 80; server_name api.lp33ing.com admin.lp33ing.com admin-v2.lp33ing.com; return 301 https://$host$request_uri; }

  server {
    listen 443 ssl;
    server_name api.lp33ing.com;
    add_header X-Request-ID $request_id always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location /api/admin/ { return 404; }
    location /api/portal/ { return 404; }
    location / {
      limit_req zone=merchant_api burst=2 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Request-ID;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://payment_api;
    }
  }

  server {
    listen 443 ssl;
    server_name admin.lp33ing.com;
    add_header X-Request-ID $request_id always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location /api/admin/ {
      limit_req zone=admin_auth burst=5 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Request-ID;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://payment_api;
    }
    location /api/portal/ {
      limit_req zone=admin_auth burst=5 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Request-ID;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://payment_api;
    }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Request-ID;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://payment_admin;
    }
  }

  server {
    listen 443 ssl;
    server_name admin-v2.lp33ing.com;
    access_log /dev/stdout;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
      # Variable proxy_pass -> resolve manager-ui via Docker DNS at request
      # time (resolver above), so UI container recreates don't need a reload.
      set $admin_ui manager-ui;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_send_timeout 60s;
      proxy_pass http://$admin_ui:80;
    }
  }
}
