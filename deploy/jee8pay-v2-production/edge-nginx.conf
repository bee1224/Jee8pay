# Canonical copy of the production edge nginx config.
# Deployed to /etc/lp33ing-production/edge-nginx.conf (bind-mounted read-only into lp33ing-production-edge).
# After changing: cp to host path, then `docker exec lp33ing-production-edge nginx -t && nginx -s reload`.

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format edge 'request_id=$request_id source_ip=$remote_addr method=$request_method host=$host uri=$uri status=$status bytes=$body_bytes_sent request_time=$request_time';
  access_log /dev/stdout edge;
  sendfile on;
  keepalive_timeout 30s;
  client_body_timeout 15s;
  client_header_timeout 15s;
  client_max_body_size 12m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  map_hash_bucket_size 64;
  server_names_hash_bucket_size 64;

  map $uri $admin_auth_limit_key {
    default "";
    /api/admin/auth/login $binary_remote_addr;
    /api/portal/auth/login $binary_remote_addr;
  }
  map $uri $merchant_api_limit_key {
    default "";
    /api/pay_order $binary_remote_addr;
    /api/query_transaction $binary_remote_addr;
  }
  limit_req_zone $admin_auth_limit_key zone=admin_auth:10m rate=5r/m;
  limit_req_zone $merchant_api_limit_key zone=merchant_api:10m rate=5r/m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  geo $realip_remote_addr $api_v2_cf_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
  }

  upstream payment_api { server payment-api:8080; keepalive 16; }
  upstream payment_admin { server payment-admin:8080; keepalive 8; }

  server {
    listen 80 default_server;
    server_name _;
    location = /edge-health { access_log off; default_type text/plain; return 200 'OK'; }
    location / { return 444; }
  }
  server { listen 443 ssl default_server; server_name _; return 444; }
  server { listen 80; server_name api.lp33ing.com admin.lp33ing.com admin-v2.lp33ing.com api-v2.lp33ing.com; return 301 https://$host$request_uri; }

  server {
    listen 443 ssl;
    server_name api.lp33ing.com;
    add_header X-Request-ID $request_id always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location /api/admin/ { return 404; }
    location /api/portal/ { return 404; }
    location / {
      limit_req zone=merchant_api burst=2 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Request-ID;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://payment_api;
    }
  }

  server {
    listen 443 ssl;
    server_name admin.lp33ing.com;
    add_header X-Request-ID $request_id always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location /api/admin/ {
      limit_req zone=admin_auth burst=5 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Request-ID;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://payment_api;
    }
    location /api/portal/ {
      limit_req zone=admin_auth burst=5 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Request-ID;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://payment_api;
    }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Request-ID;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://payment_admin;
    }
  }

  server {
    listen 443 ssl;
    server_name admin-v2.lp33ing.com;
    access_log /dev/stdout;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
      # Variable proxy_pass -> resolve manager-ui via Docker DNS at request
      # time (resolver above), so UI container recreates don't need a reload.
      set $admin_ui manager-ui;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_send_timeout 60s;
      proxy_pass http://$admin_ui:80;
    }
  }

  server {
    listen 443 ssl;
    server_name api-v2.lp33ing.com;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    access_log /dev/stdout;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 僅接受 Cloudflare 來源（V2 Merchant API 白名單路由）
    if ($api_v2_cf_peer = 0) {
      return 403;
    }

    location = /api/pay/unifiedOrder {
      # 白名單由 host cron 依 allowlist.json 產生（/etc/nginx/allowlist/uat.conf），儲存後約 1 分鐘內自動套用
      include /etc/nginx/allowlist/uat.conf;
      deny all;
      limit_except POST { deny all; }
      set $v2pay payment;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 150s;
      proxy_send_timeout 60s;
      proxy_pass http://$v2pay:9216;
    }

    location = /api/pay/query {
      # 白名單由 host cron 依 allowlist.json 產生（/etc/nginx/allowlist/uat.conf），儲存後約 1 分鐘內自動套用
      include /etc/nginx/allowlist/uat.conf;
      deny all;
      limit_except POST { deny all; }
      set $v2pay payment;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://$v2pay:9216;
    }

    location / {
      return 404;
    }
  }
}
